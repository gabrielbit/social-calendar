# Railway cron: ejecutar un pase del outbox y salir.
# Configurar en Railway → Service → Cron Schedule, p.ej. cada minuto:
#   node dist/index.js --once
#
# Para worker continuo (loop cada 15s), desplegar sin cron y usar:
#   node dist/index.js

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @agenda/worker build"

[deploy]
startCommand = "node apps/worker/dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
