project_id = "agenda-comunidad"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/google-calendar/callback",
]
enable_signup = true
jwt_expiry = 604800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = true
# Requiere GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en el entorno al hacer `supabase start`
# (las mismas de apps/api/.env). Redirect URI en Google Cloud:
# http://127.0.0.1:54321/auth/v1/callback
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true
